<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #15120c;">
  <h2 style="margin: 0 0 12px;">Your Sunday Line sign-in code</h2>
  <p style="font-size: 32px; letter-spacing: 8px; font-weight: bold; margin: 8px 0 16px;">{{ .Token }}</p>
  <p>Type this code on the sign-in page. Or tap the button on the device where you want to be signed in:</p>
  <p style="margin: 20px 0;">
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
       style="background: #f5a524; color: #1a1306; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Sign in to Sunday Line
    </a>
  </p>
  <p style="color: #6f7884; font-size: 13px;">The code works for one hour. If you didn't ask for it, you can ignore this email.</p>
</div>
