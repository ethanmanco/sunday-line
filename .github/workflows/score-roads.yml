# Scores roads people ask about in the app (docs/plan.md 11.27).
# Hourly, and on demand from the Actions tab. Needs one repository secret:
# SUPABASE_SECRET_KEY (Supabase: Project Settings > API Keys > secret key).
name: Score requested roads

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: score-roads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://ggbdcdkzvubcgzkdkrwn.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY isn't set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        if: steps.setup.outputs.ready == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Score the queue
        if: steps.setup.outputs.ready == 'true'
        run: python -m pipeline.score_queue --limit 20
