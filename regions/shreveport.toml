# Starting region: northwest Louisiana, east Texas, south Arkansas.
# Adding a region means adding a file like this one. No code changes.

slug = "shreveport"
name = "Shreveport region (NW Louisiana, East Texas, South Arkansas)"
timezone = "America/Chicago"
units = "imperial"            # imperial: miles and mph. metric: km and km/h.
country = "US"

# west, south, east, north (degrees)
bbox = [-95.6, 31.0, -92.0, 34.0]

# A "home" point for the Local list (Shreveport). Radius in miles; change freely.
home = [-93.75, 32.51]
home_name = "Shreveport"
area = "northwest Louisiana, east Texas, and south Arkansas"
local_radius_mi = 50

# OpenStreetMap extracts covering the box. Clipped to the box while reading.
osm_extracts = [
  "https://download.geofabrik.de/north-america/us/louisiana-latest.osm.pbf",
  "https://download.geofabrik.de/north-america/us/arkansas-latest.osm.pbf",
  "https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf",
]

# Elevation: USGS 3DEP 1 arc-second, bare earth, public domain.
dem = "usgs_3dep_1as"

# Land cover for forest and water scenery: ESA WorldCover 10 m (2021), CC BY 4.0, global.
landcover = "esa_worldcover_2021"

# Legal default speed limits for roads with no posted sign, by state.
# Used where OpenStreetMap has no maxspeed. Shown in the app as "state default".
# Local signs can set a lower limit, so these are upper bounds, not guarantees.
[speed_defaults.Texas]
source = "Texas Transportation Code 545.352(b): 70 mph on state- or US-numbered highways (including FM and RM roads) and 60 mph on other highways outside an urban district"
numbered = 70
unnumbered = 60
numbered_ref = '^(FM|RM|SH|TX|US|IH|I|SL|SS|Loop|Spur|PR|RE|BU|BS|Bus|Business)[ -]?\d'

[speed_defaults.Louisiana]
source = "La. R.S. 32:61: 55 mph on any highway unless a lower limit is posted"
numbered = 55
unnumbered = 55

[speed_defaults.Arkansas]
source = "Assumed 55 mph, the value ARDOT uses for unposted state highways; the statute's rural passenger-car default was not confirmed"
numbered = 55
unnumbered = 55
assumed = true

# Last-resort estimates by road type, used only outside the states above.
# Shown in the app labeled "estimated". Values in the region's units (mph).
[speed_estimates]
primary = 55
secondary = 55
tertiary = 45
unclassified = 35
