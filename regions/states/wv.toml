# West Virginia, one state as its own region. Written by `python -m pipeline states`;
# rerunning that command overwrites this file.

slug = "wv"
name = "West Virginia"
area = "West Virginia"
timezone = "America/New_York"
units = "imperial"
country = "US"
states = ["West Virginia"]

# west, south, east, north (degrees). `state` replaces this with the extract's header box.
bbox = [-82.65, 37.19, -77.71, 40.93]

# No home point: per-state runs skip the Local list and home_mi.

osm_extracts = ["https://download.geofabrik.de/north-america/us/west-virginia/west-virginia-latest.osm.pbf"]

dem = "usgs_3dep_1as"
landcover = "esa_worldcover_2021"

# No researched legal default for this state yet: unposted roads use the
# estimates below and are labeled "estimated" in the app.

# Last-resort estimates by road type (mph).
[speed_estimates]
primary = 55
secondary = 55
tertiary = 45
unclassified = 35
