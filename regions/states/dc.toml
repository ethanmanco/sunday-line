# District of Columbia, one state as its own region. Written by `python -m pipeline states`;
# rerunning that command overwrites this file.

slug = "dc"
name = "District of Columbia"
area = "District of Columbia"
timezone = "America/New_York"
units = "imperial"
country = "US"
states = ["District of Columbia"]

# west, south, east, north (degrees). `state` replaces this with the extract's header box.
bbox = [-77.13, 38.79, -76.9, 39]

# No home point: per-state runs skip the Local list and home_mi.

osm_extracts = ["https://download.geofabrik.de/north-america/us/district-of-columbia/district-of-columbia-latest.osm.pbf"]

dem = "usgs_3dep_1as"
landcover = "esa_worldcover_2021"

# No researched legal default for this state yet: unposted roads use the
# estimates below and are labeled "estimated" in the app.

# Last-resort estimates by road type (mph).
[speed_estimates]
primary = 55
secondary = 55
tertiary = 45
unclassified = 35
