# Washington, one state as its own region. Written by `python -m pipeline states`;
# rerunning that command overwrites this file.

slug = "wa"
name = "Washington"
area = "Washington"
timezone = "America/Los_Angeles"
units = "imperial"
country = "US"
states = ["Washington"]

# west, south, east, north (degrees). `state` replaces this with the extract's header box.
bbox = [-126.75, 45.53, -116.91, 49.01]

# No home point: per-state runs skip the Local list and home_mi.

osm_extracts = ["https://download.geofabrik.de/north-america/us/washington/washington-latest.osm.pbf"]

dem = "usgs_3dep_1as"
landcover = "esa_worldcover_2021"

# No researched legal default for this state yet: unposted roads use the
# estimates below and are labeled "estimated" in the app.

# Last-resort estimates by road type (mph).
[speed_estimates]
primary = 55
secondary = 55
tertiary = 45
unclassified = 35
