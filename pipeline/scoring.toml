# Sunday Line road scoring. All numbers that shape a score live here.
# Any change to this file bumps `version`, and every road records the version
# that scored it.

version = "4-draft"

[candidate]
min_length_m = 2000          # shorter stretches are not candidates
min_weighted_curve_m = 300   # total weighted curvature a stretch needs
straight_split_m = 1609      # a straight this long splits a road into pieces
simplify_tolerance_m = 0.0   # 0 = keep every mapped point
resample_step_m = 10         # the road is re-measured at points this far apart
radius_offset_steps = 3      # radius taken across +-30 m, so mapping wobbles don't read as corners
min_curve_span_m = 15.0      # a curve must cover at least this much road
require_name = true          # unnamed ways are left to community submissions

# Curvature bands: radius in meters below which a weight applies.
# Checked from tightest to broadest. Radius >= the largest value counts 0.
[[curvature.bands]]
max_radius_m = 40
weight = 2.5
[[curvature.bands]]
max_radius_m = 80
weight = 2.0
[[curvature.bands]]
max_radius_m = 150
weight = 1.5
[[curvature.bands]]
max_radius_m = 300
weight = 1.0

[elevation]
sample_every_m = 30
# Elevation = 100 * (1 - exp(-X / scale)), X = climb + descent in meters per km.
scale = 25

[surface]
paved = 100
untagged_major = 80     # tertiary and larger, surface not tagged
untagged_minor = 60     # unclassified, surface not tagged
unpaved = 10
paved_values = ["asphalt", "paved", "concrete", "chipseal", "concrete:plates", "concrete:lanes", "metal"]

# Aerial-photo surface classifier (python -m pipeline surface)
photo_unpaved_at = 0.5      # untagged road: treat as gravel at or above this probability
photo_unsure_at = 0.35      # untagged road: flag "could be gravel"
photo_override_at = 0.9     # tagged paved, but photos are this sure it's gravel

[homes]
building_within_m = 60
# Recorded for each road. Since 11.33 neighborhoods no longer keep a road off the list.
neighborhood_homes_per_km = 10   # a house or driveway about every 100 m (rural median here is about 4)
neighborhood_built_share = 0.12  # share of built-up land within 100 m (ESA WorldCover)
venue_point_within_m = 400       # an off-road park or race track this close to the road

[quiet]
living_street = 100
service = 100
unclassified = 100
residential = 90
tertiary = 90
secondary = 65
primary = 35
trunk = 20
motorway = 0
more_than_two_lanes_penalty = 20

[scenery]
sample_every_m = 50
forest_within_m = 150       # forest = average tree cover (ESA WorldCover) within this distance
water_within_m = 300
water_min_share = 0.03      # a point is "near water" if 3% of the land within 300 m is open water
wetland_min_share = 0.10
wetland_weight = 0.5        # wetlands count as half-water
w_forest = 0.45
w_water = 0.35
w_protected = 0.20
byway_bonus = 0.15          # if at least 30% of the stretch is on a scenic byway
byway_min_share = 0.30

[scenic_v2]
# Scenic score v2 (plan 11.65, pipeline/scenic.py): a pass over finished exports
# that adds terrain, views, big water and open country to trees, water,
# protected land and byways. Parts combine as 1 - product(1 - weight * part).
# Weights tuned against pipeline/scenic_refs.toml with scripts/scenic_check.py.
version = "2"
relief_radius_m = 1500
relief_m = [60, 500]        # rise and fall within the radius: none below, full at the top
open_relief_m = [50, 250]   # open country counts from this much rise and fall (deserts, buttes)
above_m = [40, 300]         # road above the lowest 10% of the land around it
big_water_share = 0.20      # a point is on big water if 20% of the land within 1 km is open water...
vast_water_share = [0.08, 0.40]  # ...counted in full when this share of the land within 3 km is water (ocean, Great Lakes)
built_full = 0.5            # built-up share within 150 m that takes the full penalty
w_forest = 0.45
w_water = 0.20
w_big_water = 0.70
w_terrain = 0.85
w_overlook = 0.16
w_open = 0.60               # times the open-country relief, so flat farmland and prairie don't count
w_protected = 0.59
w_byway = 0.50
w_built = 0.80
view_built_share = 0.20     # big water and views lose only this share of the built-up penalty

[flow]
# Flow = 100 * exp(-I / scale), I = weighted interruptions per km.
scale = 1.5
junction = 1.0
stop = 2.0
signals = 2.5
rail = 1.0
yield = 0.5

[overall]
# Driver's road weights (v3, 2026-11-18). Speed ties Twisty; Pavement counts
# because a rough road doesn't work a car the way a smooth one does; Scenic is lowest.
# "geometric": Twisty and Speed are combined so a road needs both.
combine = "geometric"
twisty = 0.28
speed = 0.28
pavement = 0.16
flow = 0.12
elevation = 0.10
quiet = 0.04
scenic = 0.02

[categories]
min_speed = 35          # driver's roads: speed limit at least this (40 before 11.33)...
min_speed_share = 0.8   # ...on at least 80% of the stretch, and paved
min_pavement = 55       # and a Pavement score at least this (below: "needs a check")
min_overall = 30        # and an Overall score at least this (11.35; lower ones stay in All)

# ---- Pavement quality (0 to 100) ------------------------------------------
# Public data rarely measures pavement on county roads, so the starting point
# is who keeps the road up (FHWA HPMS ownership, or a state route number).
# Starting points come from Ethan's 2026-11-18 Street View check of the top
# roads: 2 of 16 Texas county roads were good, 5 of 8 Louisiana parish roads,
# and the state highways were fine. People's checks always win.
[pavement]
state_route = 85
city = 55
unknown = 50
county = { Texas = 40, Louisiana = 60, Arkansas = 55 }
busy_aadt = 1000          # county roads this busy are usually kept up
busy_bonus = 15
iri_good = 95             # inches per mile; FHWA "good" is under 95
iri_poor = 170            # FHWA "poor" is over 170
iri_good_bonus = 10
iri_poor_penalty = 10
tagged_paved_bonus = 5    # someone mapped the surface as asphalt or concrete
photo_penalty = 40        # times the aerial-photo chance of gravel
verified_good = 85            # "paved and fine", same as a state highway
verified_rough = 15

# ---- Driving model (track-style), version 2 -----------------------------
[drive]
max_lateral_g = 0.5     # the virtual driver slows for curves to stay under this
accel_g = 0.3
brake_g = 0.5
working_g = 0.2         # cornering at or above this counts as "working the car"
track_ratio_scale = 0.83 # Twisty = 100 * (1 - exp(-ratio / 0.83)); matching the track average gives 70

[drive.twisty_mix]
cornering = 0.6         # sustained cornering load
braking = 0.25          # braking zones into slower corners
transitions = 0.15      # quick left-right changes (esses)

[drive.speed]
zero_at_mph = 25        # average legal speed that scores 0 (35 before 11.33, when the floor was 40 mph)
full_at_mph = 65        # average legal speed that scores 100

# Track averages from `python -m pipeline.reference` (Twisty about 70).
[drive.reference]
mean_lat_g = 0.207
braking_ms_per_km = 28.5
transitions_per_km = 2.58
